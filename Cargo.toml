[package]
name = "ssr-client-gtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Linux desktop ShadowsocksR client — GTK4 + libadwaita UI with the in-process ssr-client-rs core"
license = "GPL-3.0-or-later"
repository = "https://github.com/liangzhaoyuan12/ssr-client-gtk"
readme = "README.md"
keywords = ["shadowsocksr", "proxy", "gtk", "libadwaita", "linux"]
categories = ["gui", "network-programming"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_5", "gtk_v4_18"] }
glib = "0.22"
ssr-client-rs = "0.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
async-channel = "2"
log = "0.4"
hickory-resolver = "0.26"

[dev-dependencies]
tempfile = "3"

# ---- platform-specific (Phase 8.1, GOAL §11) ---------------------------
# `libc` is only touched by Unix-only code (sigaction, setlocale LC_MESSAGES);
# on Windows those symbols do not exist, so the dependency itself is target
# gated. Windows needs `windows-sys` for the console ctrl handler that plays
# the role of the signal handlers (exit cleanup path).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Globalization"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
